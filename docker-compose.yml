services:
  db:
    image: postgres:16-alpine
    container_name: workflex-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: workflex
      POSTGRES_PASSWORD: workflex_dev
      POSTGRES_DB: workflex
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflex -d workflex"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
